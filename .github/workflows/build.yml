name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create project files
        run: |
          mkdir -p "$(dirname "settings.gradle.kts")"
          cat > "settings.gradle.kts" <<'EOF_0'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven("https://jitpack.io")
              }
          }
          rootProject.name = "YT2MP3"
          include(":app")
          EOF_0
          mkdir -p "$(dirname "build.gradle.kts")"
          cat > "build.gradle.kts" <<'EOF_1'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_1
          mkdir -p "$(dirname "gradle.properties")"
          cat > "gradle.properties" <<'EOF_2'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          kotlin.code.style=official
          EOF_2
          mkdir -p "$(dirname ".gitignore")"
          cat > ".gitignore" <<'EOF_3'
          .gradle/
          build/
          local.properties
          .idea/
          *.iml
          EOF_3
          mkdir -p "$(dirname "app/build.gradle.kts")"
          cat > "app/build.gradle.kts" <<'EOF_4'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.ytmp3"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.ytmp3"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  ndk {
                      abiFilters += listOf("arm64-v8a", "armeabi-v7a")
                  }
              }

              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("io.github.junkfood02.youtubedl-android:library:0.17.2")
              implementation("io.github.junkfood02.youtubedl-android:ffmpeg:0.17.2")
          }
          EOF_4
          mkdir -p "$(dirname "app/src/main/AndroidManifest.xml")"
          cat > "app/src/main/AndroidManifest.xml" <<'EOF_5'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:extractNativeLibs="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.App">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_5
          mkdir -p "$(dirname "app/src/main/java/com/example/ytmp3/MainActivity.kt")"
          cat > "app/src/main/java/com/example/ytmp3/MainActivity.kt" <<'EOF_6'
          package com.example.ytmp3

          import android.content.ClipboardManager
          import android.content.ContentValues
          import android.graphics.BitmapFactory
          import android.os.Bundle
          import android.os.Environment
          import android.provider.MediaStore
          import android.view.View
          import android.widget.Button
          import android.widget.EditText
          import android.widget.ImageView
          import android.widget.ProgressBar
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import androidx.appcompat.widget.SwitchCompat
          import com.yausername.ffmpeg.FFmpeg
          import com.yausername.youtubedl_android.YoutubeDL
          import com.yausername.youtubedl_android.YoutubeDLRequest
          import java.io.File
          import java.net.URL

          class MainActivity : AppCompatActivity() {

              private lateinit var input: EditText
              private lateinit var convertBtn: Button
              private lateinit var progress: ProgressBar
              private lateinit var status: TextView
              private lateinit var playlistCheck: SwitchCompat
              private lateinit var resultCard: View
              private lateinit var thumb: ImageView
              private lateinit var songTitle: TextView
              private lateinit var songCounter: TextView
              @Volatile private var ready = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  input = findViewById(R.id.linkInput)
                  convertBtn = findViewById(R.id.convertBtn)
                  progress = findViewById(R.id.progress)
                  status = findViewById(R.id.status)
                  playlistCheck = findViewById(R.id.playlistCheck)
                  resultCard = findViewById(R.id.resultCard)
                  thumb = findViewById(R.id.thumb)
                  songTitle = findViewById(R.id.songTitle)
                  songCounter = findViewById(R.id.songCounter)

                  Thread {
                      try {
                          YoutubeDL.getInstance().init(application)
                          FFmpeg.getInstance().init(application)
                          setStatus("Se actualizează yt-dlp...")
                          updateYtDlp()
                          ready = true
                          setStatus("Gata. Lipește un link.")
                      } catch (e: Exception) {
                          setStatus("Eroare inițializare: ${e.message}")
                      }
                  }.start()

                  findViewById<Button>(R.id.pasteBtn).setOnClickListener {
                      val cm = getSystemService(CLIPBOARD_SERVICE) as ClipboardManager
                      val text = cm.primaryClip?.getItemAt(0)?.text?.toString()
                      if (!text.isNullOrBlank()) input.setText(text.trim())
                  }

                  convertBtn.setOnClickListener { convert() }
              }

              // Actualizează yt-dlp la ultima versiune stabilă (YouTube se schimbă des).
              // Folosește reflexie ca să meargă indiferent cum se numește constanta STABLE în bibliotecă.
              private fun updateYtDlp() {
                  try {
                      val yd = YoutubeDL.getInstance()
                      val m = yd.javaClass.methods.first {
                          it.name == "updateYoutubeDL" && it.parameterTypes.size == 2
                      }
                      val channelClass = m.parameterTypes[1]
                      val stable = channelClass.fields.firstOrNull {
                          java.lang.reflect.Modifier.isStatic(it.modifiers) &&
                              it.name.contains("STABLE", ignoreCase = true)
                      }?.get(null)
                      m.invoke(yd, application, stable)
                  } catch (e: Throwable) {
                      // dacă actualizarea eșuează, continuăm cu versiunea inclusă
                  }
              }

              private fun setStatus(msg: String) = runOnUiThread { status.text = msg }

              private fun showSong(title: String, id: String) {
                  runOnUiThread { songTitle.text = title }
                  Thread {
                      try {
                          val conn = URL("https://i.ytimg.com/vi/$id/mqdefault.jpg").openConnection()
                          conn.connectTimeout = 8000
                          conn.readTimeout = 8000
                          val bmp = conn.getInputStream().use { BitmapFactory.decodeStream(it) }
                          if (bmp != null) {
                              runOnUiThread {
                                  thumb.scaleType = ImageView.ScaleType.CENTER_CROP
                                  thumb.setImageBitmap(bmp)
                              }
                          }
                      } catch (e: Exception) {
                          // fără miniatură, nu e grav
                      }
                  }.start()
              }

              private fun convert() {
                  val url = input.text.toString().trim()
                  if (url.isEmpty()) { setStatus("Introdu un link."); return }
                  if (!ready) { setStatus("Încă se inițializează, mai așteaptă puțin."); return }

                  val playlist = playlistCheck.isChecked
                  convertBtn.isEnabled = false
                  progress.progress = 0
                  resultCard.visibility = View.VISIBLE
                  thumb.scaleType = ImageView.ScaleType.CENTER
                  thumb.setImageResource(R.drawable.ic_play)
                  songTitle.text = "Se pregătește..."
                  songCounter.text = ""
                  setStatus("Se descarcă și se convertește...")

                  Thread {
                      val dir = File(cacheDir, "dl").apply { deleteRecursively(); mkdirs() }
                      try {
                          val req = YoutubeDLRequest(url)
                          if (playlist) {
                              req.addOption("--yes-playlist")
                              req.addOption("-i") // sare peste videoclipurile indisponibile
                          } else {
                              req.addOption("--no-playlist")
                          }
                          req.addOption("-f", "bestaudio/best")
                          req.addOption("-x")
                          req.addOption("--audio-format", "mp3")
                          req.addOption("--audio-quality", "0")
                          req.addOption("-o", dir.absolutePath + "/%(title)s [%(id)s].%(ext)s")

                          val itemRegex = Regex("""Downloading item (\d+) of (\d+)""")
                          val destRegex = Regex("""Destination: .*/(.+) \[([A-Za-z0-9_-]{11})\]\.\w+\s*$""")
                          var lastId = ""
                          try {
                              YoutubeDL.getInstance().execute(req) { p, _, line ->
                                  itemRegex.find(line)?.let {
                                      val txt = "MELODIA ${it.groupValues[1]} / ${it.groupValues[2]}"
                                      runOnUiThread { songCounter.text = txt }
                                  }
                                  destRegex.find(line)?.let {
                                      val id = it.groupValues[2]
                                      if (id != lastId) {
                                          lastId = id
                                          showSong(it.groupValues[1], id)
                                      }
                                  }
                                  runOnUiThread { progress.progress = p.toInt().coerceAtLeast(0) }
                              }
                          } catch (e: Exception) {
                              // la playlist, păstrăm ce s-a convertit deja
                              if (!playlist || dir.listFiles()?.any { it.extension == "mp3" } != true) throw e
                          }

                          val files = dir.listFiles()?.filter { it.extension == "mp3" }.orEmpty()
                          if (files.isEmpty()) throw Exception("Nu s-a generat niciun MP3")
                          files.forEach { saveToMusic(it) }
                          runOnUiThread { progress.progress = 100 }
                          setStatus("Salvate ${files.size} fișier(e) în Music/YT2MP3")
                      } catch (e: Exception) {
                          setStatus("Eroare: ${e.message}")
                      } finally {
                          dir.deleteRecursively()
                          runOnUiThread { convertBtn.isEnabled = true }
                      }
                  }.start()
              }

              private fun saveToMusic(file: File) {
                  val cleanName = file.nameWithoutExtension
                      .replace(Regex(""" \[[A-Za-z0-9_-]{11}\]$"""), "") + ".mp3"
                  val values = ContentValues().apply {
                      put(MediaStore.Audio.Media.DISPLAY_NAME, cleanName)
                      put(MediaStore.Audio.Media.MIME_TYPE, "audio/mpeg")
                      put(MediaStore.Audio.Media.RELATIVE_PATH, Environment.DIRECTORY_MUSIC + "/YT2MP3")
                  }
                  val uri = contentResolver.insert(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, values)
                      ?: throw Exception("Nu pot crea fișierul în Music")
                  contentResolver.openOutputStream(uri)!!.use { out ->
                      file.inputStream().use { it.copyTo(out) }
                  }
              }
          }
          EOF_6
