name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create project files
        run: |
          mkdir -p "$(dirname "settings.gradle.kts")"
          cat > "settings.gradle.kts" <<'EOF_0'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven("https://jitpack.io")
              }
          }
          rootProject.name = "YT2MP3"
          include(":app")
          EOF_0
          mkdir -p "$(dirname "build.gradle.kts")"
          cat > "build.gradle.kts" <<'EOF_1'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_1
          mkdir -p "$(dirname "gradle.properties")"
          cat > "gradle.properties" <<'EOF_2'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          kotlin.code.style=official
          EOF_2
          mkdir -p "$(dirname ".gitignore")"
          cat > ".gitignore" <<'EOF_3'
          .gradle/
          build/
          local.properties
          .idea/
          *.iml
          EOF_3
          mkdir -p "$(dirname "app/build.gradle.kts")"
          cat > "app/build.gradle.kts" <<'EOF_4'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.ytmp3"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.ytmp3"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  ndk {
                      abiFilters += listOf("arm64-v8a", "armeabi-v7a")
                  }
              }

              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("io.github.junkfood02.youtubedl-android:library:0.17.2")
              implementation("io.github.junkfood02.youtubedl-android:ffmpeg:0.17.2")
          }
          EOF_4
          mkdir -p "$(dirname "app/src/main/AndroidManifest.xml")"
          cat > "app/src/main/AndroidManifest.xml" <<'EOF_5'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:allowBackup="true"
                  android:extractNativeLibs="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.App">

                  <service
                      android:name=".ConvertService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_5
          mkdir -p "$(dirname "app/src/main/java/com/example/ytmp3/ConvertService.kt")"
          cat > "app/src/main/java/com/example/ytmp3/ConvertService.kt" <<'EOF_6'
          package com.example.ytmp3

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.ContentValues
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Environment
          import android.os.IBinder
          import android.os.PowerManager
          import android.provider.MediaStore
          import androidx.core.app.NotificationCompat
          import com.yausername.ffmpeg.FFmpeg
          import com.yausername.youtubedl_android.YoutubeDL
          import com.yausername.youtubedl_android.YoutubeDLRequest
          import java.io.File
          import java.util.concurrent.CopyOnWriteArrayList
          import java.util.concurrent.atomic.AtomicInteger

          class ConvertService : Service() {

              companion object {
                  const val EXTRA_URLS = "urls"
                  const val EXTRA_PLAYLIST = "playlist"
                  const val EXTRA_SKIP = "skip"
                  const val EXTRA_WORKERS = "workers"
                  const val EXTRA_RETRY = "retry"
                  const val ACTION_STOP = "com.example.ytmp3.STOP"
                  const val CHANNEL = "convert"
                  const val NOTIF_ID = 1
                  const val DONE_NOTIF_ID = 2
                  const val PROCESS_ID = "tdg_convert"
                  const val LIST_PROCESS_ID = "tdg_list"
                  const val MAX_WORKERS = 4
                  @Volatile var working = false
              }

              @Volatile private var cancelled = false
              @Volatile private var skipDup = true
              private val seen = java.util.Collections.synchronizedSet(HashSet<String>())
              private val badLinks = AtomicInteger(0)
              private val pendingListings = AtomicInteger(0)
              private val listLock = Any()

              override fun onBind(intent: Intent?): IBinder? = null

              private fun killProcess(id: String) {
                  try {
                      YoutubeDL.getInstance().destroyProcessById(id)
                  } catch (e: Throwable) {
                      // nu e nimic de oprit
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_STOP) {
                      cancelled = true
                      killProcess(PROCESS_ID)
                      killProcess(LIST_PROCESS_ID)
                      for (w in 0 until MAX_WORKERS) killProcess(PROCESS_ID + "_" + w)
                      if (!working) {
                          JobState.running = false
                          JobState.changed()
                          stopSelf()
                      }
                      return START_NOT_STICKY
                  }

                  createChannel()
                  startForeground(
                      NOTIF_ID,
                      buildNotif("Se pornește...", 0, true),
                      ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC
                  )

                  val urls = intent?.getStringArrayListExtra(EXTRA_URLS)
                  val playlist = intent?.getBooleanExtra(EXTRA_PLAYLIST, false) ?: false
                  val skip = intent?.getBooleanExtra(EXTRA_SKIP, true) ?: true
                  val retry = intent?.getBooleanExtra(EXTRA_RETRY, false) ?: false
                  val workers = (intent?.getIntExtra(EXTRA_WORKERS, 3) ?: 3).coerceIn(1, MAX_WORKERS)
                  if (urls == null || urls.isEmpty()) {
                      if (!working) stopSelf()
                      return START_NOT_STICKY
                  }

                  if (working) {
                      // O conversie rulează deja: adăugăm linkurile noi la finalul listei.
                      skipDup = skip
                      pendingListings.incrementAndGet()
                      Thread { addUrls(urls, playlist, retry) }.start()
                      return START_NOT_STICKY
                  }

                  cancelled = false
                  skipDup = skip
                  working = true
                  Thread { runJob(urls, playlist, workers, retry) }.start()
                  return START_NOT_STICKY
              }

              private fun createChannel() {
                  val ch = NotificationChannel(CHANNEL, "Conversii", NotificationManager.IMPORTANCE_LOW)
                  getSystemService(NotificationManager::class.java).createNotificationChannel(ch)
              }

              private fun openIntent(): PendingIntent {
                  val i = Intent(this, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP)
                  return PendingIntent.getActivity(this, 0, i, PendingIntent.FLAG_IMMUTABLE)
              }

              private fun buildNotif(text: String, pct: Int, indeterminate: Boolean): Notification {
                  val stop = PendingIntent.getService(
                      this, 1,
                      Intent(this, ConvertService::class.java).setAction(ACTION_STOP),
                      PendingIntent.FLAG_IMMUTABLE
                  )
                  return NotificationCompat.Builder(this, CHANNEL)
                      .setSmallIcon(R.drawable.ic_notif)
                      .setContentTitle("TDG YT2MP3 CONVERT  " + pct + "%")
                      .setContentText(text)
                      .setContentIntent(openIntent())
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .setProgress(100, pct, indeterminate)
                      .addAction(0, "OPREȘTE", stop)
                      .build()
              }

              private fun notifyDone(text: String) {
                  val n = NotificationCompat.Builder(this, CHANNEL)
                      .setSmallIcon(R.drawable.ic_notif)
                      .setContentTitle("TDG YT2MP3 CONVERT")
                      .setContentText(text)
                      .setContentIntent(openIntent())
                      .setAutoCancel(true)
                      .build()
                  getSystemService(NotificationManager::class.java).notify(DONE_NOTIF_ID, n)
              }

              // Anunță interfața și actualizează notificarea.
              private fun push() {
                  JobState.changed()
                  val list = JobState.items
                  val idx = JobState.current
                  val text = if (idx in list.indices) {
                      val total = list.count { it.state != SongItem.REMOVED }
                      val done = list.count {
                          it.state == SongItem.DONE || it.state == SongItem.ERROR || it.state == SongItem.SKIPPED
                      }
                      "" + done + "/" + total + " · " + list[idx].title
                  } else {
                      JobState.message
                  }
                  val pct = JobState.overallPercent()
                  getSystemService(NotificationManager::class.java)
                      .notify(NOTIF_ID, buildNotif(text, pct, list.isEmpty()))
              }

              // La reîncercare, o melodie poate fi adăugată din nou chiar dacă a mai fost în listă.
              private fun register(id: String, force: Boolean): Boolean {
                  return if (force) {
                      seen.add(id)
                      true
                  } else {
                      seen.add(id)
                  }
              }

              // Adaugă linkuri noi în timp ce conversia curentă continuă.
              private fun addUrls(urls: List<String>, playlist: Boolean, force: Boolean) {
                  var added = 0
                  try {
                      synchronized(listLock) {
                          for (u in urls) {
                              if (cancelled) break
                              try {
                                  for (s in fetchList(u, playlist, LIST_PROCESS_ID)) {
                                      if (register(s.id, force)) {
                                          if (skipDup && alreadyDownloaded(s.id)) s.state = SongItem.SKIPPED
                                          JobState.items.add(s)
                                          added++
                                      }
                                  }
                              } catch (e: Exception) {
                                  if (cancelled) break
                                  badLinks.incrementAndGet()
                              }
                          }
                      }
                      JobState.message = if (added > 0) {
                          "Adăugate " + added + " melodii în coadă"
                      } else {
                          "Nimic nou de adăugat (linkuri invalide sau deja în listă)"
                      }
                      push()
                  } finally {
                      pendingListings.decrementAndGet()
                  }
              }

              private fun runJob(urls: List<String>, playlist: Boolean, workers: Int, force: Boolean) {
                  val pm = getSystemService(POWER_SERVICE) as PowerManager
                  val wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "ytmp3:job")
                  wl.acquire(6 * 60 * 60 * 1000L)
                  val dir = File(cacheDir, "dl")
                  val savedC = AtomicInteger(0)
                  val failedC = AtomicInteger(0)
                  val skippedC = AtomicInteger(0)
                  var finalMsg = ""
                  try {
                      YoutubeDL.getInstance().init(application)
                      FFmpeg.getInstance().init(application)

                      val list = CopyOnWriteArrayList<SongItem>()
                      seen.clear()
                      badLinks.set(0)
                      JobState.items = list
                      JobState.current = -1
                      JobState.message = "Se citește lista..."
                      push()

                      // Citește toate linkurile și combină melodiile într-o singură listă.
                      for ((n, u) in urls.withIndex()) {
                          if (cancelled) break
                          JobState.message = "Se citesc linkurile " + (n + 1) + "/" + urls.size + "..."
                          push()
                          try {
                              for (s in fetchList(u, playlist, PROCESS_ID)) {
                                  if (register(s.id, force)) {
                                      if (skipDup && alreadyDownloaded(s.id)) s.state = SongItem.SKIPPED
                                      list.add(s)
                                  }
                              }
                          } catch (e: Exception) {
                              if (cancelled) break
                              badLinks.incrementAndGet()
                          }
                      }
                      if (cancelled) throw Exception("Oprit")
                      if (list.isEmpty() && pendingListings.get() == 0) {
                          throw Exception("Nu am găsit nicio melodie la linkurile date")
                      }

                      JobState.message = "Se descarcă " + list.size + " melodie(i), câte " + workers + " odată..."
                      push()

                      // Mai mulți lucrători iau melodii din aceeași listă, în paralel.
                      // Linkurile adăugate între timp apar la final și sunt preluate automat.
                      val nextIdx = AtomicInteger(0)
                      val active = AtomicInteger(0)
                      val claimLock = Any()
                      val threads = ArrayList<Thread>()
                      for (w in 0 until workers) {
                          val t = Thread {
                              val wdir = File(dir, "w" + w)
                              while (!cancelled) {
                                  var claim = -1
                                  var finished = false
                                  synchronized(claimLock) {
                                      if (nextIdx.get() < list.size) {
                                          claim = nextIdx.getAndIncrement()
                                          active.incrementAndGet()
                                      } else if (pendingListings.get() == 0 && active.get() == 0) {
                                          finished = true
                                      }
                                      Unit
                                  }
                                  if (claim >= 0) {
                                      val item = list[claim]
                                      try {
                                          val st = item.state
                                          if (st == SongItem.SKIPPED) {
                                              skippedC.incrementAndGet()
                                              JobState.changed()
                                          } else if (item.tryChange(SongItem.WAITING, SongItem.DOWNLOADING)) {
                                              JobState.current = claim
                                              item.percent = 0
                                              push()
                                              try {
                                                  wdir.deleteRecursively()
                                                  wdir.mkdirs()
                                                  downloadOne(item, wdir, PROCESS_ID + "_" + w)
                                                  item.state = SongItem.DONE
                                                  item.percent = 100
                                                  savedC.incrementAndGet()
                                              } catch (e: Exception) {
                                                  if (cancelled) {
                                                      item.state = SongItem.WAITING
                                                      item.percent = 0
                                                  } else {
                                                      item.state = SongItem.ERROR
                                                      failedC.incrementAndGet()
                                                  }
                                              }
                                              push()
                                          } else {
                                              // eliminată din coadă între timp
                                              JobState.changed()
                                          }
                                      } finally {
                                          active.decrementAndGet()
                                      }
                                  } else if (finished) {
                                      break
                                  } else {
                                      Thread.sleep(300)
                                  }
                              }
                          }
                          threads.add(t)
                          t.start()
                      }
                      for (t in threads) t.join()

                      val saved = savedC.get()
                      val failed = failedC.get()
                      val skipped = skippedC.get()
                      val bad = if (badLinks.get() > 0) " · " + badLinks.get() + " link(uri) nevalide" else ""
                      val sk = if (skipped > 0) ", " + skipped + " sărite (existau deja)" else ""
                      finalMsg = when {
                          cancelled -> "Oprit. Salvate: $saved"
                          failed > 0 -> "Gata: $saved salvate" + sk + ", $failed eșuate" + bad
                          else -> "Gata: $saved salvate în Music/YT2MP3" + sk + bad
                      }
                  } catch (e: Exception) {
                      finalMsg = if (cancelled) "Oprit" else "Eroare: " + e.message
                  } finally {
                      JobState.message = finalMsg
                      JobState.running = false
                      working = false
                      JobState.changed()
                      dir.deleteRecursively()
                      if (wl.isHeld) wl.release()
                      stopForeground(STOP_FOREGROUND_REMOVE)
                      notifyDone(finalMsg)
                      stopSelf()
                  }
              }

              // Citește lista completă (id + titlu) fără să descarce nimic.
              private fun fetchList(url: String, playlist: Boolean, processId: String): List<SongItem> {
                  val req = YoutubeDLRequest(url)
                  req.addOption(if (playlist) "--yes-playlist" else "--no-playlist")
                  req.addOption("--flat-playlist")
                  req.addOption("-i")
                  req.addOption("--print", "%(id)s|%(title)s")
                  val out = YoutubeDL.getInstance().execute(req, processId) { _, _, _ -> }.out
                  val idRegex = Regex("^[A-Za-z0-9_-]{11}$")
                  val result = ArrayList<SongItem>()
                  for (raw in out.split("\n")) {
                      val line = raw.trim()
                      if (line.indexOf('|') != 11) continue
                      val id = line.substring(0, 11)
                      if (!idRegex.matches(id)) continue
                      val title = line.substring(12).trim().ifEmpty { id }
                      result.add(SongItem(id, title))
                  }
                  return result
              }

              // Încearcă mai întâi cu titlu, artist și copertă în MP3; dacă eșuează, reia fără ele.
              private fun downloadOne(item: SongItem, dir: File, processId: String) {
                  try {
                      runDownload(item, dir, processId, true)
                  } catch (e: Exception) {
                      if (cancelled) throw e
                      dir.deleteRecursively()
                      dir.mkdirs()
                      item.state = SongItem.DOWNLOADING
                      item.percent = 0
                      push()
                      runDownload(item, dir, processId, false)
                  }
                  val mp3 = dir.listFiles()?.firstOrNull { it.extension == "mp3" }
                      ?: throw Exception("Nu s-a generat MP3")
                  val savedName = saveToMusic(mp3, item.title)
                  getSharedPreferences("history", MODE_PRIVATE).edit()
                      .putString("dl_" + item.id, savedName).apply()
              }

              private fun runDownload(item: SongItem, dir: File, processId: String, embed: Boolean) {
                  val req = YoutubeDLRequest("https://www.youtube.com/watch?v=" + item.id)
                  req.addOption("--no-playlist")
                  req.addOption("-f", "bestaudio/best")
                  req.addOption("-x")
                  req.addOption("--audio-format", "mp3")
                  req.addOption("--audio-quality", "0")
                  if (embed) {
                      req.addOption("--embed-metadata")
                      req.addOption("--embed-thumbnail")
                      req.addOption("--convert-thumbnails", "jpg")
                  }
                  req.addOption("-N", "4")
                  req.addOption("--throttled-rate", "100K")
                  req.addOption("--retries", "5")
                  req.addOption("-o", dir.absolutePath + "/%(id)s.%(ext)s")

                  var lastPush = -10
                  YoutubeDL.getInstance().execute(req, processId) { p, _, line ->
                      if (line.contains("[ExtractAudio]")) {
                          if (item.state != SongItem.CONVERTING) {
                              item.state = SongItem.CONVERTING
                              push()
                          }
                      } else if (item.state == SongItem.DOWNLOADING) {
                          val pct = p.toInt().coerceIn(0, 100)
                          if (pct != item.percent) {
                              item.percent = pct
                              if (pct - lastPush >= 2 || pct >= 100) {
                                  lastPush = pct
                                  push()
                              }
                          }
                      }
                  }
              }

              // True dacă melodia a mai fost descărcată și fișierul încă există în Music/YT2MP3.
              private fun alreadyDownloaded(id: String): Boolean {
                  val name = getSharedPreferences("history", MODE_PRIVATE).getString("dl_" + id, null)
                      ?: return false
                  return try {
                      contentResolver.query(
                          MediaStore.Audio.Media.EXTERNAL_CONTENT_URI,
                          arrayOf(MediaStore.Audio.Media._ID),
                          MediaStore.Audio.Media.DISPLAY_NAME + "=? AND " +
                              MediaStore.Audio.Media.RELATIVE_PATH + " LIKE ?",
                          arrayOf(name, Environment.DIRECTORY_MUSIC + "/YT2MP3%"),
                          null
                      )?.use { it.count > 0 } ?: true
                  } catch (e: Exception) {
                      true
                  }
              }

              private fun saveToMusic(file: File, title: String): String {
                  val clean = title.replace(Regex("""[\\/:*?"<>|]"""), "_").trim().take(120)
                      .ifEmpty { "melodie" } + ".mp3"
                  val values = ContentValues().apply {
                      put(MediaStore.Audio.Media.DISPLAY_NAME, clean)
                      put(MediaStore.Audio.Media.TITLE, title)
                      put(MediaStore.Audio.Media.IS_MUSIC, 1)
                      put(MediaStore.Audio.Media.MIME_TYPE, "audio/mpeg")
                      put(MediaStore.Audio.Media.RELATIVE_PATH, Environment.DIRECTORY_MUSIC + "/YT2MP3")
                  }
                  val uri = contentResolver.insert(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, values)
                      ?: throw Exception("Nu pot crea fișierul în Music")
                  contentResolver.openOutputStream(uri)!!.use { out ->
                      file.inputStream().use { it.copyTo(out) }
                  }
                  return clean
              }
          }
          EOF_6
          mkdir -p "$(dirname "app/src/main/java/com/example/ytmp3/JobState.kt")"
          cat > "app/src/main/java/com/example/ytmp3/JobState.kt" <<'EOF_7'
          package com.example.ytmp3

          import android.os.Handler
          import android.os.Looper
          import java.util.concurrent.CopyOnWriteArrayList
          import java.util.concurrent.atomic.AtomicInteger

          class SongItem(val id: String, val title: String) {
              private val stateRef = AtomicInteger(WAITING)

              var state: Int
                  get() = stateRef.get()
                  set(v) { stateRef.set(v) }

              @Volatile var percent: Int = 0

              // Schimbă starea doar dacă este încă cea așteptată (evită conflicte între interfață și lucrători).
              fun tryChange(from: Int, to: Int): Boolean = stateRef.compareAndSet(from, to)

              companion object {
                  const val WAITING = 0
                  const val DOWNLOADING = 1
                  const val CONVERTING = 2
                  const val DONE = 3
                  const val ERROR = 4
                  const val SKIPPED = 5
                  const val REMOVED = 6
              }
          }

          object JobState {
              @Volatile var items: CopyOnWriteArrayList<SongItem> = CopyOnWriteArrayList()
              @Volatile var running: Boolean = false
              @Volatile var current: Int = -1
              @Volatile var message: String = ""
              @Volatile var listener: (() -> Unit)? = null
              private val handler = Handler(Looper.getMainLooper())

              fun changed() {
                  handler.post { listener?.invoke() }
              }

              fun overallPercent(): Int {
                  val list = items
                  var sum = 0.0
                  var count = 0
                  for (s in list) {
                      if (s.state == SongItem.REMOVED) continue
                      count++
                      sum += when (s.state) {
                          SongItem.DOWNLOADING -> s.percent * 0.9
                          SongItem.CONVERTING -> 95.0
                          SongItem.DONE, SongItem.ERROR, SongItem.SKIPPED -> 100.0
                          else -> 0.0
                      }
                  }
                  if (count == 0) return 0
                  return (sum / count).toInt().coerceIn(0, 100)
              }
          }
          EOF_7
          mkdir -p "$(dirname "app/src/main/java/com/example/ytmp3/MainActivity.kt")"
          cat > "app/src/main/java/com/example/ytmp3/MainActivity.kt" <<'EOF_8'
          package com.example.ytmp3

          import android.Manifest
          import android.content.ClipboardManager
          import android.content.Intent
          import android.content.SharedPreferences
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.os.Build
          import android.os.Bundle
          import android.text.Editable
          import android.text.TextWatcher
          import android.util.LruCache
          import android.view.HapticFeedbackConstants
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewConfiguration
          import android.widget.EditText
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ProgressBar
          import android.widget.ScrollView
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat
          import com.yausername.ffmpeg.FFmpeg
          import com.yausername.youtubedl_android.YoutubeDL
          import java.net.URL
          import java.util.concurrent.CopyOnWriteArrayList
          import java.util.concurrent.Executors
          import kotlin.math.abs

          class MainActivity : AppCompatActivity() {

              private lateinit var scroll: ScrollView
              private lateinit var input: EditText
              private lateinit var clearBtn: View
              private lateinit var chipPlaylist: TextView
              private lateinit var chipSkip: TextView
              private lateinit var chipWorkers: TextView
              private lateinit var status: TextView
              private lateinit var emptyHint: TextView
              private lateinit var heroCard: View
              private lateinit var ring: RingProgressView
              private lateinit var thumb: ImageView
              private lateinit var heroPercent: TextView
              private lateinit var songTitle: TextView
              private lateinit var songCounter: TextView
              private lateinit var overallText: TextView
              private lateinit var progress: ProgressBar
              private lateinit var tabsBar: View
              private lateinit var tabViews: List<TextView>
              private lateinit var retryAll: TextView
              private lateinit var songList: LinearLayout
              private lateinit var mainBtn: TextView
              private lateinit var addBtn: View
              private lateinit var parallelPill: TextView
              private lateinit var prefs: SharedPreferences

              @Volatile private var ready = false
              private var autoStart = false
              private var filter = 0
              private var playlistOn = false
              private var skipOn = true
              private var workers = 3

              private class Row(
                  val item: SongItem,
                  val root: View,
                  val fg: View,
                  val bar: ProgressBar,
                  val pill: TextView,
                  val retry: ImageView
              ) {
                  var lastState = -1
                  var lastPct = -1
              }

              private val rows = ArrayList<Row>()
              private var renderedFor: List<SongItem>? = null
              private var bigShownId = ""
              private val cache = LruCache<String, Bitmap>(80)
              private val executor = Executors.newFixedThreadPool(2)

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  scroll = findViewById(R.id.scroll)
                  input = findViewById(R.id.linkInput)
                  clearBtn = findViewById(R.id.clearBtn)
                  chipPlaylist = findViewById(R.id.chipPlaylist)
                  chipSkip = findViewById(R.id.chipSkip)
                  chipWorkers = findViewById(R.id.chipWorkers)
                  status = findViewById(R.id.status)
                  emptyHint = findViewById(R.id.emptyHint)
                  heroCard = findViewById(R.id.heroCard)
                  ring = findViewById(R.id.ring)
                  thumb = findViewById(R.id.thumb)
                  heroPercent = findViewById(R.id.heroPercent)
                  songTitle = findViewById(R.id.songTitle)
                  songCounter = findViewById(R.id.songCounter)
                  overallText = findViewById(R.id.overallPercent)
                  progress = findViewById(R.id.progress)
                  tabsBar = findViewById(R.id.tabsBar)
                  retryAll = findViewById(R.id.retryAll)
                  songList = findViewById(R.id.songList)
                  mainBtn = findViewById(R.id.mainBtn)
                  addBtn = findViewById(R.id.addBtn)
                  parallelPill = findViewById(R.id.parallelPill)
                  tabViews = listOf(
                      findViewById<TextView>(R.id.tabAll),
                      findViewById<TextView>(R.id.tabActive),
                      findViewById<TextView>(R.id.tabDone),
                      findViewById<TextView>(R.id.tabErrors)
                  )

                  prefs = getSharedPreferences("settings", MODE_PRIVATE)
                  playlistOn = prefs.getBoolean("playlist", false)
                  skipOn = prefs.getBoolean("skip", true)
                  workers = prefs.getInt("workers", 3).coerceIn(1, 4)
                  applyChips()

                  chipPlaylist.setOnClickListener {
                      haptic(it)
                      playlistOn = !playlistOn
                      prefs.edit().putBoolean("playlist", playlistOn).apply()
                      applyChips()
                  }
                  chipSkip.setOnClickListener {
                      haptic(it)
                      skipOn = !skipOn
                      prefs.edit().putBoolean("skip", skipOn).apply()
                      applyChips()
                  }
                  chipWorkers.setOnClickListener {
                      haptic(it)
                      workers = workers % 4 + 1
                      prefs.edit().putInt("workers", workers).apply()
                      applyChips()
                  }

                  for ((i, t) in tabViews.withIndex()) {
                      t.setOnClickListener {
                          haptic(it)
                          filter = i
                          render()
                      }
                  }

                  input.addTextChangedListener(object : TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, st: Int, c: Int, a: Int) {}
                      override fun onTextChanged(s: CharSequence?, st: Int, b: Int, c: Int) {}
                      override fun afterTextChanged(s: Editable?) {
                          clearBtn.visibility = if (s.isNullOrEmpty()) View.GONE else View.VISIBLE
                      }
                  })
                  clearBtn.setOnClickListener {
                      haptic(it)
                      input.setText("")
                  }
                  findViewById<View>(R.id.pasteBtn).setOnClickListener {
                      haptic(it)
                      val cm = getSystemService(CLIPBOARD_SERVICE) as ClipboardManager
                      val text = cm.primaryClip?.getItemAt(0)?.text?.toString()
                      if (!text.isNullOrBlank()) {
                          val cur = input.text.toString().trimEnd()
                          input.setText(if (cur.isEmpty()) text.trim() else cur + "\n" + text.trim())
                          input.setSelection(input.text.length)
                      }
                  }
                  findViewById<View>(R.id.topBtn).setOnClickListener {
                      haptic(it)
                      scroll.smoothScrollTo(0, 0)
                  }
                  mainBtn.setOnClickListener {
                      haptic(it)
                      onMainClick()
                  }
                  addBtn.setOnClickListener {
                      haptic(it)
                      onAddClick()
                  }
                  retryAll.setOnClickListener {
                      haptic(it)
                      onRetry(JobState.items.filter { s -> s.state == SongItem.ERROR })
                  }

                  for (v in listOf(findViewById<View>(R.id.pasteBtn), findViewById<View>(R.id.topBtn),
                      mainBtn, addBtn, chipPlaylist, chipSkip, chipWorkers, retryAll)) {
                      pressable(v)
                  }

                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                  }

                  handleIntent(intent)

                  Thread {
                      try {
                          YoutubeDL.getInstance().init(application)
                          FFmpeg.getInstance().init(application)
                          setStatus("Se actualizează yt-dlp...")
                          updateYtDlp()
                          ready = true
                          if (!JobState.running) setStatus("Gata. Lipește un link.")
                          if (autoStart) {
                              runOnUiThread {
                                  autoStart = false
                                  onMainClick()
                              }
                          }
                      } catch (e: Exception) {
                          setStatus("Eroare inițializare: ${e.message}")
                      }
                  }.start()
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  setIntent(intent)
                  handleIntent(intent)
              }

              override fun onResume() {
                  super.onResume()
                  JobState.listener = { render() }
                  render()
              }

              override fun onPause() {
                  super.onPause()
                  JobState.listener = null
              }

              // Linkuri primite din „Distribuie” în aplicația YouTube.
              private fun handleIntent(i: Intent?) {
                  if (i == null || i.action != Intent.ACTION_SEND) return
                  val text = i.getStringExtra(Intent.EXTRA_TEXT) ?: return
                  val urls = parseUrls(text)
                  setIntent(Intent())
                  if (urls.isEmpty()) return
                  if (JobState.running) {
                      submit(urls, false)
                  } else {
                      input.setText(urls.joinToString("\n"))
                      if (ready) {
                          onMainClick()
                      } else {
                          autoStart = true
                          setStatus("Link primit. Pornesc imediat ce e gata...")
                      }
                  }
              }

              // Actualizează yt-dlp la ultima versiune stabilă (YouTube se schimbă des).
              private fun updateYtDlp() {
                  try {
                      val yd = YoutubeDL.getInstance()
                      val m = yd.javaClass.methods.first {
                          it.name == "updateYoutubeDL" && it.parameterTypes.size == 2
                      }
                      val channelClass = m.parameterTypes[1]
                      val stable = channelClass.fields.firstOrNull {
                          java.lang.reflect.Modifier.isStatic(it.modifiers) &&
                              it.name.contains("STABLE", ignoreCase = true)
                      }?.get(null)
                      m.invoke(yd, application, stable)
                  } catch (e: Throwable) {
                      // dacă actualizarea eșuează, continuăm cu versiunea inclusă
                  }
              }

              private fun setStatus(msg: String) {
                  JobState.message = msg
                  runOnUiThread { status.text = msg }
              }

              private fun haptic(v: View) {
                  v.performHapticFeedback(HapticFeedbackConstants.VIRTUAL_KEY)
              }

              // Efect de apăsare: butonul se micșorează puțin cât ții degetul pe el.
              private fun pressable(v: View) {
                  v.setOnTouchListener { view, e ->
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN ->
                              view.animate().scaleX(0.94f).scaleY(0.94f).setDuration(80).start()
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL ->
                              view.animate().scaleX(1f).scaleY(1f).setDuration(120).start()
                      }
                      false
                  }
              }

              private fun setChip(v: TextView, on: Boolean) {
                  v.setBackgroundResource(if (on) R.drawable.bg_chip_on else R.drawable.bg_chip_off)
                  v.setTextColor(getColor(if (on) R.color.cyan else R.color.text2))
                  v.setCompoundDrawablesWithIntrinsicBounds(if (on) R.drawable.ic_check_small else 0, 0, 0, 0)
              }

              private fun applyChips() {
                  setChip(chipPlaylist, playlistOn)
                  setChip(chipSkip, skipOn)
                  chipWorkers.text = "Simultan ×" + workers
              }

              private fun parseUrls(text: String): List<String> {
                  return Regex("""https?://\S+""").findAll(text).map { it.value }.distinct().toList()
              }

              private fun onMainClick() {
                  if (JobState.running) {
                      startService(Intent(this, ConvertService::class.java).setAction(ConvertService.ACTION_STOP))
                      return
                  }
                  val urls = parseUrls(input.text.toString())
                  if (urls.isEmpty()) {
                      setStatus("Nu am găsit niciun link (trebuie să înceapă cu http).")
                      return
                  }
                  if (!ready) {
                      setStatus("Încă se inițializează, mai așteaptă puțin.")
                      return
                  }
                  submit(urls, false)
              }

              // Adaugă linkuri noi în coadă, fără să oprească conversia curentă.
              private fun onAddClick() {
                  val urls = parseUrls(input.text.toString())
                  if (urls.isEmpty()) {
                      setStatus("Nu am găsit niciun link (trebuie să înceapă cu http).")
                      return
                  }
                  submit(urls, false)
                  input.setText("")
              }

              // Reîncearcă melodiile cu eroare (rândul vechi dispare, cel nou apare la final).
              private fun onRetry(list: List<SongItem>) {
                  val toRetry = list.filter { it.tryChange(SongItem.ERROR, SongItem.REMOVED) }
                  if (toRetry.isEmpty()) return
                  val urls = toRetry.map { "https://www.youtube.com/watch?v=" + it.id }
                  submit(urls, true)
              }

              private fun submit(urls: List<String>, retry: Boolean) {
                  if (!JobState.running) {
                      JobState.items = CopyOnWriteArrayList()
                      JobState.current = -1
                      JobState.message = "Se citește lista..."
                      JobState.running = true
                  } else {
                      JobState.message = "Se adaugă în coadă..."
                  }
                  val i = Intent(this, ConvertService::class.java)
                      .putStringArrayListExtra(ConvertService.EXTRA_URLS, ArrayList(urls))
                      .putExtra(ConvertService.EXTRA_PLAYLIST, playlistOn)
                      .putExtra(ConvertService.EXTRA_SKIP, skipOn)
                      .putExtra(ConvertService.EXTRA_WORKERS, workers)
                      .putExtra(ConvertService.EXTRA_RETRY, retry)
                  ContextCompat.startForegroundService(this, i)
                  render()
              }

              private fun loadThumb(url: String, view: ImageView) {
                  view.tag = url
                  val cached = cache.get(url)
                  if (cached != null) {
                      view.scaleType = ImageView.ScaleType.CENTER_CROP
                      view.setImageBitmap(cached)
                      return
                  }
                  view.scaleType = ImageView.ScaleType.CENTER
                  view.setImageResource(R.drawable.ic_play)
                  executor.execute {
                      try {
                          val conn = URL(url).openConnection()
                          conn.connectTimeout = 8000
                          conn.readTimeout = 8000
                          val bmp = conn.getInputStream().use { BitmapFactory.decodeStream(it) }
                          if (bmp != null) {
                              cache.put(url, bmp)
                              runOnUiThread {
                                  if (view.tag == url) {
                                      view.scaleType = ImageView.ScaleType.CENTER_CROP
                                      view.setImageBitmap(bmp)
                                  }
                              }
                          }
                      } catch (e: Exception) {
                          // fără miniatură, nu e grav
                      }
                  }
              }

              // Tragi un rând în lateral ca să-l scoți din coadă (doar cât așteaptă).
              private inner class SwipeTouch(private val row: Row) : View.OnTouchListener {
                  private var downX = 0f
                  private var downY = 0f
                  private var dragging = false
                  private val slop = ViewConfiguration.get(this@MainActivity).scaledTouchSlop
                  private val maxPx = 160f * resources.displayMetrics.density
                  private val thresholdPx = 90f * resources.displayMetrics.density

                  override fun onTouch(v: View, e: MotionEvent): Boolean {
                      if (row.item.state != SongItem.WAITING && !dragging) return false
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              downX = e.rawX
                              downY = e.rawY
                              dragging = false
                              return true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = e.rawX - downX
                              val dy = e.rawY - downY
                              if (!dragging && abs(dx) > slop && abs(dx) > abs(dy)) {
                                  dragging = true
                                  v.parent?.requestDisallowInterceptTouchEvent(true)
                              }
                              if (dragging) v.translationX = dx.coerceIn(-maxPx, 0f)
                              return true
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                              if (dragging) {
                                  val dx = v.translationX
                                  if (e.actionMasked == MotionEvent.ACTION_UP && dx <= -thresholdPx &&
                                      row.item.tryChange(SongItem.WAITING, SongItem.REMOVED)
                                  ) {
                                      haptic(v)
                                      row.root.animate().alpha(0f).setDuration(150)
                                          .withEndAction { JobState.changed() }.start()
                                  } else {
                                      v.animate().translationX(0f).setDuration(150).start()
                                  }
                              }
                              dragging = false
                              return true
                          }
                      }
                      return false
                  }
              }

              private fun addRow(item: SongItem) {
                  val root = layoutInflater.inflate(R.layout.item_song, songList, false)
                  val fg = root.findViewById<View>(R.id.rowFg)
                  val thumbView = root.findViewById<ImageView>(R.id.rowThumb)
                  val titleView = root.findViewById<TextView>(R.id.rowTitle)
                  val bar = root.findViewById<ProgressBar>(R.id.rowBar)
                  val pill = root.findViewById<TextView>(R.id.rowPill)
                  val retry = root.findViewById<ImageView>(R.id.rowRetry)
                  titleView.text = item.title
                  loadThumb("https://i.ytimg.com/vi/" + item.id + "/default.jpg", thumbView)
                  val row = Row(item, root, fg, bar, pill, retry)
                  retry.setOnClickListener {
                      haptic(it)
                      onRetry(listOf(item))
                  }
                  fg.setOnTouchListener(SwipeTouch(row))
                  root.alpha = 0f
                  songList.addView(root)
                  root.animate().alpha(1f).setDuration(200).start()
                  rows.add(row)
              }

              private fun matchesFilter(s: Int): Boolean {
                  return when (filter) {
                      0 -> s != SongItem.REMOVED
                      1 -> s == SongItem.DOWNLOADING || s == SongItem.CONVERTING
                      2 -> s == SongItem.DONE || s == SongItem.SKIPPED
                      else -> s == SongItem.ERROR
                  }
              }

              private fun stylePill(r: Row, s: Int, pct: Int) {
                  when (s) {
                      SongItem.DOWNLOADING -> {
                          r.pill.text = pct.toString() + "%"
                          r.pill.setBackgroundResource(R.drawable.bg_pill_active)
                          r.pill.setTextColor(getColor(R.color.cyan))
                      }
                      SongItem.CONVERTING -> {
                          r.pill.text = "CONVERSIE"
                          r.pill.setBackgroundResource(R.drawable.bg_pill_exists)
                          r.pill.setTextColor(getColor(R.color.violet))
                      }
                      SongItem.DONE -> {
                          r.pill.text = "GATA"
                          r.pill.setBackgroundResource(R.drawable.bg_pill_done)
                          r.pill.setTextColor(getColor(R.color.cyan))
                      }
                      SongItem.ERROR -> {
                          r.pill.text = "EROARE"
                          r.pill.setBackgroundResource(R.drawable.bg_pill_error)
                          r.pill.setTextColor(getColor(R.color.error))
                      }
                      SongItem.SKIPPED -> {
                          r.pill.text = "EXISTĂ"
                          r.pill.setBackgroundResource(R.drawable.bg_pill_exists)
                          r.pill.setTextColor(getColor(R.color.violet))
                      }
                      else -> {
                          r.pill.text = "AȘTEAPTĂ"
                          r.pill.setBackgroundResource(R.drawable.bg_pill_wait)
                          r.pill.setTextColor(getColor(R.color.text2))
                      }
                  }
              }

              private fun render() {
                  val items = JobState.items
                  val running = JobState.running

                  mainBtn.text = if (running) "STOP" else "CONVERT"
                  mainBtn.setCompoundDrawablesWithIntrinsicBounds(
                      if (running) R.drawable.ic_stop else R.drawable.ic_download, 0, 0, 0
                  )
                  addBtn.visibility = if (running) View.VISIBLE else View.INVISIBLE
                  if (JobState.message.isNotEmpty()) status.text = JobState.message

                  if (renderedFor !== items) {
                      songList.removeAllViews()
                      rows.clear()
                      renderedFor = items
                      bigShownId = ""
                  }
                  while (rows.size < items.size) addRow(items[rows.size])

                  var nAll = 0
                  var nActive = 0
                  var nDone = 0
                  var nErr = 0
                  val count = minOf(items.size, rows.size)
                  for (i in 0 until count) {
                      val item = items[i]
                      val row = rows[i]
                      val s = item.state
                      val pct = item.percent
                      if (s != SongItem.REMOVED) nAll++
                      if (s == SongItem.DOWNLOADING || s == SongItem.CONVERTING) nActive++
                      if (s == SongItem.DONE || s == SongItem.SKIPPED) nDone++
                      if (s == SongItem.ERROR) nErr++

                      if (s != row.lastState || pct != row.lastPct) {
                          if (s != row.lastState) {
                              row.fg.setBackgroundResource(
                                  if (s == SongItem.DOWNLOADING || s == SongItem.CONVERTING)
                                      R.drawable.bg_row_active else R.drawable.bg_row
                              )
                              row.retry.visibility = if (s == SongItem.ERROR) View.VISIBLE else View.GONE
                          }
                          stylePill(row, s, pct)
                          val barValue = when (s) {
                              SongItem.DOWNLOADING -> pct
                              SongItem.CONVERTING, SongItem.DONE -> 100
                              else -> 0
                          }
                          row.bar.setProgress(barValue, true)
                          row.lastState = s
                          row.lastPct = pct
                      }
                      row.root.visibility = if (matchesFilter(s)) View.VISIBLE else View.GONE
                  }

                  val showHero = running || nAll > 0
                  heroCard.visibility = if (showHero) View.VISIBLE else View.GONE
                  tabsBar.visibility = if (showHero) View.VISIBLE else View.GONE
                  emptyHint.visibility = if (showHero) View.GONE else View.VISIBLE
                  retryAll.visibility = if (filter == 3 && nErr > 0) View.VISIBLE else View.GONE

                  tabViews[0].text = "Toate " + nAll
                  tabViews[1].text = "În curs " + nActive
                  tabViews[2].text = "Gata " + nDone
                  tabViews[3].text = "Erori " + nErr
                  for ((i, t) in tabViews.withIndex()) {
                      t.setBackgroundResource(if (i == filter) R.drawable.bg_tab_on else 0)
                      t.setTextColor(getColor(if (i == filter) R.color.cyan else R.color.text2))
                  }

                  parallelPill.visibility = if (running && nActive > 0) View.VISIBLE else View.GONE
                  parallelPill.text = nActive.toString() + " PARALEL"

                  val cur = JobState.current
                  if (cur in 0 until count) {
                      val s = items[cur]
                      val p = when (s.state) {
                          SongItem.DOWNLOADING -> s.percent
                          SongItem.CONVERTING, SongItem.DONE -> 100
                          else -> 0
                      }
                      ring.setProgress(p)
                      heroPercent.text = p.toString() + "%"
                      songTitle.text = s.title
                      songCounter.text = "MELODIA " + (cur + 1) + " / " + items.size
                      if (bigShownId != s.id) {
                          bigShownId = s.id
                          loadThumb("https://i.ytimg.com/vi/" + s.id + "/mqdefault.jpg", thumb)
                      }
                  } else if (running) {
                      ring.setProgress(0)
                      heroPercent.text = "0%"
                      songTitle.text = "Se citește lista..."
                      songCounter.text = ""
                  }
                  val total = JobState.overallPercent()
                  progress.setProgress(total, true)
                  overallText.text = total.toString() + "%"
              }
          }
          EOF_8
          mkdir -p "$(dirname "app/src/main/java/com/example/ytmp3/RingProgressView.kt")"
          cat > "app/src/main/java/com/example/ytmp3/RingProgressView.kt" <<'EOF_9'
          package com.example.ytmp3

          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.graphics.RectF
          import android.util.AttributeSet
          import android.view.View

          class RingProgressView @JvmOverloads constructor(
              context: Context,
              attrs: AttributeSet? = null
          ) : View(context, attrs) {

              private val density = resources.displayMetrics.density
              private val track = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  color = context.getColor(R.color.stroke)
              }
              private val arc = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeCap = Paint.Cap.ROUND
                  color = context.getColor(R.color.cyan)
              }
              private val rect = RectF()
              private var shown = 0f
              private var target = -1
              private var animator: ValueAnimator? = null

              fun setProgress(p: Int) {
                  val t = p.coerceIn(0, 100)
                  if (t == target) return
                  target = t
                  animator?.cancel()
                  val a = ValueAnimator.ofFloat(shown, t.toFloat())
                  a.duration = 300
                  a.addUpdateListener {
                      shown = it.animatedValue as Float
                      invalidate()
                  }
                  a.start()
                  animator = a
              }

              override fun onDraw(canvas: Canvas) {
                  val w = 6f * density
                  track.strokeWidth = w
                  arc.strokeWidth = w
                  val half = w / 2f
                  rect.set(half, half, width - half, height - half)
                  canvas.drawArc(rect, 0f, 360f, false, track)
                  if (shown > 0f) {
                      canvas.drawArc(rect, -90f, 360f * shown / 100f, false, arc)
                  }
              }
          }
