name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create project files
        run: |
          mkdir -p "$(dirname "settings.gradle.kts")"
          cat > "settings.gradle.kts" <<'EOF_0'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven("https://jitpack.io")
              }
          }
          rootProject.name = "YT2MP3"
          include(":app")
          EOF_0
          mkdir -p "$(dirname "build.gradle.kts")"
          cat > "build.gradle.kts" <<'EOF_1'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_1
          mkdir -p "$(dirname "gradle.properties")"
          cat > "gradle.properties" <<'EOF_2'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          kotlin.code.style=official
          EOF_2
          mkdir -p "$(dirname ".gitignore")"
          cat > ".gitignore" <<'EOF_3'
          .gradle/
          build/
          local.properties
          .idea/
          *.iml
          EOF_3
          mkdir -p "$(dirname "app/build.gradle.kts")"
          cat > "app/build.gradle.kts" <<'EOF_4'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.ytmp3"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.ytmp3"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  ndk {
                      abiFilters += listOf("arm64-v8a", "armeabi-v7a")
                  }
              }

              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("io.github.junkfood02.youtubedl-android:library:0.17.2")
              implementation("io.github.junkfood02.youtubedl-android:ffmpeg:0.17.2")
          }
          EOF_4
          mkdir -p "$(dirname "app/src/main/AndroidManifest.xml")"
          cat > "app/src/main/AndroidManifest.xml" <<'EOF_5'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:allowBackup="true"
                  android:extractNativeLibs="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.App">

                  <service
                      android:name=".ConvertService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_5
          mkdir -p "$(dirname "app/src/main/java/com/example/ytmp3/ConvertService.kt")"
          cat > "app/src/main/java/com/example/ytmp3/ConvertService.kt" <<'EOF_6'
          package com.example.ytmp3

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.ContentValues
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Environment
          import android.os.IBinder
          import android.os.PowerManager
          import android.provider.MediaStore
          import androidx.core.app.NotificationCompat
          import com.yausername.ffmpeg.FFmpeg
          import com.yausername.youtubedl_android.YoutubeDL
          import com.yausername.youtubedl_android.YoutubeDLRequest
          import java.io.File
          import java.util.concurrent.CopyOnWriteArrayList
          import java.util.concurrent.atomic.AtomicInteger

          class ConvertService : Service() {

              companion object {
                  const val EXTRA_URLS = "urls"
                  const val EXTRA_PLAYLIST = "playlist"
                  const val EXTRA_SKIP = "skip"
                  const val ACTION_STOP = "com.example.ytmp3.STOP"
                  const val CHANNEL = "convert"
                  const val NOTIF_ID = 1
                  const val DONE_NOTIF_ID = 2
                  const val PROCESS_ID = "tdg_convert"
                  const val LIST_PROCESS_ID = "tdg_list"
                  @Volatile var working = false
              }

              @Volatile private var cancelled = false
              @Volatile private var skipDup = true
              private val seen = java.util.Collections.synchronizedSet(HashSet<String>())
              private val badLinks = AtomicInteger(0)
              private val pendingListings = AtomicInteger(0)
              private val listLock = Any()

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_STOP) {
                      cancelled = true
                      try {
                          YoutubeDL.getInstance().destroyProcessById(PROCESS_ID)
                      } catch (e: Throwable) {
                          // nu e nimic de oprit
                      }
                      try {
                          YoutubeDL.getInstance().destroyProcessById(LIST_PROCESS_ID)
                      } catch (e: Throwable) {
                          // nu e nimic de oprit
                      }
                      if (!working) {
                          JobState.running = false
                          JobState.changed()
                          stopSelf()
                      }
                      return START_NOT_STICKY
                  }

                  createChannel()
                  startForeground(
                      NOTIF_ID,
                      buildNotif("Se pornește...", 0, true),
                      ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC
                  )

                  val urls = intent?.getStringArrayListExtra(EXTRA_URLS)
                  val playlist = intent?.getBooleanExtra(EXTRA_PLAYLIST, false) ?: false
                  val skip = intent?.getBooleanExtra(EXTRA_SKIP, true) ?: true
                  if (urls == null || urls.isEmpty()) {
                      if (!working) stopSelf()
                      return START_NOT_STICKY
                  }

                  if (working) {
                      // O conversie rulează deja: adăugăm linkurile noi la finalul listei.
                      skipDup = skip
                      pendingListings.incrementAndGet()
                      Thread { addUrls(urls, playlist) }.start()
                      return START_NOT_STICKY
                  }

                  cancelled = false
                  skipDup = skip
                  working = true
                  Thread { runJob(urls, playlist) }.start()
                  return START_NOT_STICKY
              }

              private fun createChannel() {
                  val ch = NotificationChannel(CHANNEL, "Conversii", NotificationManager.IMPORTANCE_LOW)
                  getSystemService(NotificationManager::class.java).createNotificationChannel(ch)
              }

              private fun openIntent(): PendingIntent {
                  val i = Intent(this, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP)
                  return PendingIntent.getActivity(this, 0, i, PendingIntent.FLAG_IMMUTABLE)
              }

              private fun buildNotif(text: String, pct: Int, indeterminate: Boolean): Notification {
                  val stop = PendingIntent.getService(
                      this, 1,
                      Intent(this, ConvertService::class.java).setAction(ACTION_STOP),
                      PendingIntent.FLAG_IMMUTABLE
                  )
                  return NotificationCompat.Builder(this, CHANNEL)
                      .setSmallIcon(R.drawable.ic_notif)
                      .setContentTitle("TDG YT2MP3 CONVERT  " + pct + "%")
                      .setContentText(text)
                      .setContentIntent(openIntent())
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .setProgress(100, pct, indeterminate)
                      .addAction(0, "OPREȘTE", stop)
                      .build()
              }

              private fun notifyDone(text: String) {
                  val n = NotificationCompat.Builder(this, CHANNEL)
                      .setSmallIcon(R.drawable.ic_notif)
                      .setContentTitle("TDG YT2MP3 CONVERT")
                      .setContentText(text)
                      .setContentIntent(openIntent())
                      .setAutoCancel(true)
                      .build()
                  getSystemService(NotificationManager::class.java).notify(DONE_NOTIF_ID, n)
              }

              // Anunță interfața și actualizează notificarea.
              private fun push() {
                  JobState.changed()
                  val list = JobState.items
                  val idx = JobState.current
                  val text = if (idx in list.indices) {
                      "" + (idx + 1) + "/" + list.size + " · " + list[idx].title
                  } else {
                      JobState.message
                  }
                  val pct = JobState.overallPercent()
                  getSystemService(NotificationManager::class.java)
                      .notify(NOTIF_ID, buildNotif(text, pct, list.isEmpty()))
              }

              // Adaugă linkuri noi în timp ce conversia curentă continuă.
              private fun addUrls(urls: List<String>, playlist: Boolean) {
                  var added = 0
                  try {
                      synchronized(listLock) {
                          for (u in urls) {
                              if (cancelled) break
                              try {
                                  for (s in fetchList(u, playlist, LIST_PROCESS_ID)) {
                                      if (seen.add(s.id)) {
                                          if (skipDup && alreadyDownloaded(s.id)) s.state = SongItem.SKIPPED
                                          JobState.items.add(s)
                                          added++
                                      }
                                  }
                              } catch (e: Exception) {
                                  if (cancelled) break
                                  badLinks.incrementAndGet()
                              }
                          }
                      }
                      JobState.message = if (added > 0) {
                          "Adăugate " + added + " melodii în coadă"
                      } else {
                          "Nimic nou de adăugat (linkuri invalide sau deja în listă)"
                      }
                      push()
                  } finally {
                      pendingListings.decrementAndGet()
                  }
              }

              private fun runJob(urls: List<String>, playlist: Boolean) {
                  val pm = getSystemService(POWER_SERVICE) as PowerManager
                  val wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "ytmp3:job")
                  wl.acquire(6 * 60 * 60 * 1000L)
                  val dir = File(cacheDir, "dl")
                  var saved = 0
                  var failed = 0
                  var skipped = 0
                  var finalMsg = ""
                  try {
                      YoutubeDL.getInstance().init(application)
                      FFmpeg.getInstance().init(application)

                      val list = CopyOnWriteArrayList<SongItem>()
                      seen.clear()
                      badLinks.set(0)
                      JobState.items = list
                      JobState.current = -1
                      JobState.message = "Se citește lista..."
                      push()

                      // Citește toate linkurile și combină melodiile într-o singură listă.
                      for ((n, u) in urls.withIndex()) {
                          if (cancelled) break
                          JobState.message = "Se citesc linkurile " + (n + 1) + "/" + urls.size + "..."
                          push()
                          try {
                              for (s in fetchList(u, playlist, PROCESS_ID)) {
                                  if (seen.add(s.id)) {
                                      if (skipDup && alreadyDownloaded(s.id)) s.state = SongItem.SKIPPED
                                      list.add(s)
                                  }
                              }
                          } catch (e: Exception) {
                              if (cancelled) break
                              badLinks.incrementAndGet()
                          }
                      }
                      if (cancelled) throw Exception("Oprit")
                      if (list.isEmpty() && pendingListings.get() == 0) {
                          throw Exception("Nu am găsit nicio melodie la linkurile date")
                      }

                      JobState.message = "Se descarcă " + list.size + " melodie(i)..."
                      push()

                      // Procesează lista pe rând. Linkurile adăugate între timp apar la final.
                      var index = 0
                      while (!cancelled) {
                          if (index < list.size) {
                              val item = list[index]
                              if (item.state == SongItem.SKIPPED) {
                                  skipped++
                                  index++
                                  JobState.changed()
                                  continue
                              }
                              JobState.current = index
                              item.state = SongItem.DOWNLOADING
                              item.percent = 0
                              push()
                              try {
                                  dir.deleteRecursively()
                                  dir.mkdirs()
                                  downloadOne(item, dir)
                                  item.state = SongItem.DONE
                                  item.percent = 100
                                  saved++
                              } catch (e: Exception) {
                                  if (cancelled) {
                                      item.state = SongItem.WAITING
                                      item.percent = 0
                                      break
                                  }
                                  item.state = SongItem.ERROR
                                  failed++
                              }
                              push()
                              index++
                          } else if (pendingListings.get() > 0) {
                              Thread.sleep(300)
                          } else {
                              break
                          }
                      }

                      val bad = if (badLinks.get() > 0) " · " + badLinks.get() + " link(uri) nevalide" else ""
                      val sk = if (skipped > 0) ", " + skipped + " sărite (existau deja)" else ""
                      finalMsg = when {
                          cancelled -> "Oprit. Salvate: $saved"
                          failed > 0 -> "Gata: $saved salvate" + sk + ", $failed eșuate" + bad
                          else -> "Gata: $saved salvate în Music/YT2MP3" + sk + bad
                      }
                  } catch (e: Exception) {
                      finalMsg = if (cancelled) "Oprit" else "Eroare: " + e.message
                  } finally {
                      JobState.message = finalMsg
                      JobState.running = false
                      working = false
                      JobState.changed()
                      dir.deleteRecursively()
                      if (wl.isHeld) wl.release()
                      stopForeground(STOP_FOREGROUND_REMOVE)
                      notifyDone(finalMsg)
                      stopSelf()
                  }
              }

              // Citește lista completă (id + titlu) fără să descarce nimic.
              private fun fetchList(url: String, playlist: Boolean, processId: String): List<SongItem> {
                  val req = YoutubeDLRequest(url)
                  req.addOption(if (playlist) "--yes-playlist" else "--no-playlist")
                  req.addOption("--flat-playlist")
                  req.addOption("-i")
                  req.addOption("--print", "%(id)s|%(title)s")
                  val out = YoutubeDL.getInstance().execute(req, processId) { _, _, _ -> }.out
                  val idRegex = Regex("^[A-Za-z0-9_-]{11}$")
                  val result = ArrayList<SongItem>()
                  for (raw in out.split("\n")) {
                      val line = raw.trim()
                      if (line.indexOf('|') != 11) continue
                      val id = line.substring(0, 11)
                      if (!idRegex.matches(id)) continue
                      val title = line.substring(12).trim().ifEmpty { id }
                      result.add(SongItem(id, title))
                  }
                  return result
              }

              private fun downloadOne(item: SongItem, dir: File) {
                  val req = YoutubeDLRequest("https://www.youtube.com/watch?v=" + item.id)
                  req.addOption("--no-playlist")
                  req.addOption("-f", "bestaudio/best")
                  req.addOption("-x")
                  req.addOption("--audio-format", "mp3")
                  req.addOption("--audio-quality", "0")
                  req.addOption("-o", dir.absolutePath + "/%(id)s.%(ext)s")

                  var lastPush = -10
                  YoutubeDL.getInstance().execute(req, PROCESS_ID) { p, _, line ->
                      if (line.contains("[ExtractAudio]")) {
                          if (item.state != SongItem.CONVERTING) {
                              item.state = SongItem.CONVERTING
                              push()
                          }
                      } else if (item.state == SongItem.DOWNLOADING) {
                          val pct = p.toInt().coerceIn(0, 100)
                          if (pct != item.percent) {
                              item.percent = pct
                              if (pct - lastPush >= 2 || pct >= 100) {
                                  lastPush = pct
                                  push()
                              }
                          }
                      }
                  }

                  val mp3 = dir.listFiles()?.firstOrNull { it.extension == "mp3" }
                      ?: throw Exception("Nu s-a generat MP3")
                  val savedName = saveToMusic(mp3, item.title)
                  getSharedPreferences("history", MODE_PRIVATE).edit()
                      .putString("dl_" + item.id, savedName).apply()
              }

              // True dacă melodia a mai fost descărcată și fișierul încă există în Music/YT2MP3.
              private fun alreadyDownloaded(id: String): Boolean {
                  val name = getSharedPreferences("history", MODE_PRIVATE).getString("dl_" + id, null)
                      ?: return false
                  return try {
                      contentResolver.query(
                          MediaStore.Audio.Media.EXTERNAL_CONTENT_URI,
                          arrayOf(MediaStore.Audio.Media._ID),
                          MediaStore.Audio.Media.DISPLAY_NAME + "=? AND " +
                              MediaStore.Audio.Media.RELATIVE_PATH + " LIKE ?",
                          arrayOf(name, Environment.DIRECTORY_MUSIC + "/YT2MP3%"),
                          null
                      )?.use { it.count > 0 } ?: true
                  } catch (e: Exception) {
                      true
                  }
              }

              private fun saveToMusic(file: File, title: String): String {
                  val clean = title.replace(Regex("""[\\/:*?"<>|]"""), "_").trim().take(120)
                      .ifEmpty { "melodie" } + ".mp3"
                  val values = ContentValues().apply {
                      put(MediaStore.Audio.Media.DISPLAY_NAME, clean)
                      put(MediaStore.Audio.Media.MIME_TYPE, "audio/mpeg")
                      put(MediaStore.Audio.Media.RELATIVE_PATH, Environment.DIRECTORY_MUSIC + "/YT2MP3")
                  }
                  val uri = contentResolver.insert(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, values)
                      ?: throw Exception("Nu pot crea fișierul în Music")
                  contentResolver.openOutputStream(uri)!!.use { out ->
                      file.inputStream().use { it.copyTo(out) }
                  }
                  return clean
              }
          }
          EOF_6
          mkdir -p "$(dirname "app/src/main/java/com/example/ytmp3/JobState.kt")"
          cat > "app/src/main/java/com/example/ytmp3/JobState.kt" <<'EOF_7'
          package com.example.ytmp3

          import android.os.Handler
          import android.os.Looper
          import java.util.concurrent.CopyOnWriteArrayList

          class SongItem(val id: String, val title: String) {
              @Volatile var state: Int = WAITING
              @Volatile var percent: Int = 0

              companion object {
                  const val WAITING = 0
                  const val DOWNLOADING = 1
                  const val CONVERTING = 2
                  const val DONE = 3
                  const val ERROR = 4
                  const val SKIPPED = 5
              }
          }

          object JobState {
              @Volatile var items: CopyOnWriteArrayList<SongItem> = CopyOnWriteArrayList()
              @Volatile var running: Boolean = false
              @Volatile var current: Int = -1
              @Volatile var message: String = ""
              @Volatile var listener: (() -> Unit)? = null
              private val handler = Handler(Looper.getMainLooper())

              fun changed() {
                  handler.post { listener?.invoke() }
              }

              fun overallPercent(): Int {
                  val list = items
                  if (list.isEmpty()) return 0
                  var sum = 0.0
                  for (s in list) {
                      sum += when (s.state) {
                          SongItem.DOWNLOADING -> s.percent * 0.9
                          SongItem.CONVERTING -> 95.0
                          SongItem.DONE, SongItem.ERROR, SongItem.SKIPPED -> 100.0
                          else -> 0.0
                      }
                  }
                  return (sum / list.size).toInt().coerceIn(0, 100)
              }
          }
          EOF_7
          mkdir -p "$(dirname "app/src/main/java/com/example/ytmp3/MainActivity.kt")"
          cat > "app/src/main/java/com/example/ytmp3/MainActivity.kt" <<'EOF_8'
          package com.example.ytmp3

          import android.Manifest
          import android.content.ClipboardManager
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.os.Build
          import android.os.Bundle
          import android.util.LruCache
          import android.view.View
          import android.widget.Button
          import android.widget.EditText
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ProgressBar
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import androidx.appcompat.widget.SwitchCompat
          import androidx.core.content.ContextCompat
          import com.yausername.ffmpeg.FFmpeg
          import com.yausername.youtubedl_android.YoutubeDL
          import java.net.URL
          import java.util.concurrent.CopyOnWriteArrayList
          import java.util.concurrent.Executors

          class MainActivity : AppCompatActivity() {

              private lateinit var input: EditText
              private lateinit var convertBtn: Button
              private lateinit var addBtn: Button
              private lateinit var progress: ProgressBar
              private lateinit var overallText: TextView
              private lateinit var status: TextView
              private lateinit var playlistCheck: SwitchCompat
              private lateinit var skipCheck: SwitchCompat
              private lateinit var resultCard: View
              private lateinit var listCard: View
              private lateinit var songList: LinearLayout
              private lateinit var thumb: ImageView
              private lateinit var songTitle: TextView
              private lateinit var songCounter: TextView
              @Volatile private var ready = false

              private class Row(val bar: ProgressBar, val state: TextView)

              private val rows = ArrayList<Row>()
              private var renderedFor: List<SongItem>? = null
              private var bigShownId = ""
              private val cache = LruCache<String, Bitmap>(80)
              private val executor = Executors.newFixedThreadPool(2)

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  input = findViewById(R.id.linkInput)
                  convertBtn = findViewById(R.id.convertBtn)
                  addBtn = findViewById(R.id.addBtn)
                  progress = findViewById(R.id.progress)
                  overallText = findViewById(R.id.overallPercent)
                  status = findViewById(R.id.status)
                  playlistCheck = findViewById(R.id.playlistCheck)
                  skipCheck = findViewById(R.id.skipCheck)
                  val prefs = getSharedPreferences("settings", MODE_PRIVATE)
                  skipCheck.isChecked = prefs.getBoolean("skip", true)
                  skipCheck.setOnCheckedChangeListener { _, checked ->
                      prefs.edit().putBoolean("skip", checked).apply()
                  }
                  resultCard = findViewById(R.id.resultCard)
                  listCard = findViewById(R.id.listCard)
                  songList = findViewById(R.id.songList)
                  thumb = findViewById(R.id.thumb)
                  songTitle = findViewById(R.id.songTitle)
                  songCounter = findViewById(R.id.songCounter)

                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                  }

                  Thread {
                      try {
                          YoutubeDL.getInstance().init(application)
                          FFmpeg.getInstance().init(application)
                          setStatus("Se actualizează yt-dlp...")
                          updateYtDlp()
                          ready = true
                          if (!JobState.running) setStatus("Gata. Lipește un link.")
                      } catch (e: Exception) {
                          setStatus("Eroare inițializare: ${e.message}")
                      }
                  }.start()

                  findViewById<Button>(R.id.pasteBtn).setOnClickListener {
                      val cm = getSystemService(CLIPBOARD_SERVICE) as ClipboardManager
                      val text = cm.primaryClip?.getItemAt(0)?.text?.toString()
                      if (!text.isNullOrBlank()) {
                          val cur = input.text.toString().trimEnd()
                          input.setText(if (cur.isEmpty()) text.trim() else cur + "\n" + text.trim())
                          input.setSelection(input.text.length)
                      }
                  }

                  findViewById<Button>(R.id.clearBtn).setOnClickListener { input.setText("") }

                  convertBtn.setOnClickListener { onConvertClick() }
                  addBtn.setOnClickListener { onAddClick() }
              }

              override fun onResume() {
                  super.onResume()
                  JobState.listener = { render() }
                  render()
              }

              override fun onPause() {
                  super.onPause()
                  JobState.listener = null
              }

              // Actualizează yt-dlp la ultima versiune stabilă (YouTube se schimbă des).
              private fun updateYtDlp() {
                  try {
                      val yd = YoutubeDL.getInstance()
                      val m = yd.javaClass.methods.first {
                          it.name == "updateYoutubeDL" && it.parameterTypes.size == 2
                      }
                      val channelClass = m.parameterTypes[1]
                      val stable = channelClass.fields.firstOrNull {
                          java.lang.reflect.Modifier.isStatic(it.modifiers) &&
                              it.name.contains("STABLE", ignoreCase = true)
                      }?.get(null)
                      m.invoke(yd, application, stable)
                  } catch (e: Throwable) {
                      // dacă actualizarea eșuează, continuăm cu versiunea inclusă
                  }
              }

              private fun setStatus(msg: String) = runOnUiThread { status.text = msg }

              private fun parseUrls(): List<String> {
                  return input.text.toString()
                      .split(Regex("""\s+"""))
                      .map { it.trim() }
                      .filter { it.startsWith("http", ignoreCase = true) }
                      .distinct()
              }

              // Adaugă linkuri noi în coadă, fără să oprească conversia curentă.
              private fun onAddClick() {
                  val urls = parseUrls()
                  if (urls.isEmpty()) { setStatus("Nu am găsit niciun link (trebuie să înceapă cu http)."); return }
                  val i = Intent(this, ConvertService::class.java)
                      .putStringArrayListExtra(ConvertService.EXTRA_URLS, ArrayList(urls))
                      .putExtra(ConvertService.EXTRA_PLAYLIST, playlistCheck.isChecked)
                      .putExtra(ConvertService.EXTRA_SKIP, skipCheck.isChecked)
                  ContextCompat.startForegroundService(this, i)
                  input.setText("")
                  JobState.message = "Se adaugă în coadă..."
                  render()
              }

              private fun onConvertClick() {
                  if (JobState.running) {
                      startService(Intent(this, ConvertService::class.java).setAction(ConvertService.ACTION_STOP))
                      return
                  }
                  val urls = parseUrls()
                  if (urls.isEmpty()) { setStatus("Nu am găsit niciun link (trebuie să înceapă cu http)."); return }
                  if (!ready) { setStatus("Încă se inițializează, mai așteaptă puțin."); return }

                  JobState.items = CopyOnWriteArrayList()
                  JobState.current = -1
                  JobState.message = "Se citește lista..."
                  JobState.running = true

                  val i = Intent(this, ConvertService::class.java)
                      .putStringArrayListExtra(ConvertService.EXTRA_URLS, ArrayList(urls))
                      .putExtra(ConvertService.EXTRA_PLAYLIST, playlistCheck.isChecked)
                      .putExtra(ConvertService.EXTRA_SKIP, skipCheck.isChecked)
                  ContextCompat.startForegroundService(this, i)
                  render()
              }

              private fun loadThumb(url: String, view: ImageView) {
                  view.tag = url
                  val cached = cache.get(url)
                  if (cached != null) {
                      view.scaleType = ImageView.ScaleType.CENTER_CROP
                      view.setImageBitmap(cached)
                      return
                  }
                  view.scaleType = ImageView.ScaleType.CENTER
                  view.setImageResource(R.drawable.ic_play)
                  executor.execute {
                      try {
                          val conn = URL(url).openConnection()
                          conn.connectTimeout = 8000
                          conn.readTimeout = 8000
                          val bmp = conn.getInputStream().use { BitmapFactory.decodeStream(it) }
                          if (bmp != null) {
                              cache.put(url, bmp)
                              runOnUiThread {
                                  if (view.tag == url) {
                                      view.scaleType = ImageView.ScaleType.CENTER_CROP
                                      view.setImageBitmap(bmp)
                                  }
                              }
                          }
                      } catch (e: Exception) {
                          // fără miniatură, nu e grav
                      }
                  }
              }

              private fun render() {
                  val items = JobState.items
                  val running = JobState.running
                  convertBtn.text = if (running) "STOP" else "CONVERT"
                  addBtn.visibility = if (running) View.VISIBLE else View.GONE
                  if (JobState.message.isNotEmpty()) status.text = JobState.message

                  if (!running && items.isEmpty()) {
                      resultCard.visibility = View.GONE
                      listCard.visibility = View.GONE
                      return
                  }
                  resultCard.visibility = View.VISIBLE
                  listCard.visibility = if (items.isEmpty()) View.GONE else View.VISIBLE

                  if (renderedFor !== items) {
                      songList.removeAllViews()
                      rows.clear()
                      renderedFor = items
                      bigShownId = ""
                  }
                  // Adaugă rânduri doar pentru melodiile noi (coada poate crește în timpul conversiei).
                  while (rows.size < items.size) {
                      val item = items[rows.size]
                      val v = layoutInflater.inflate(R.layout.item_song, songList, false)
                      v.findViewById<TextView>(R.id.rowTitle).text = item.title
                      loadThumb("https://i.ytimg.com/vi/" + item.id + "/default.jpg", v.findViewById(R.id.rowThumb))
                      rows.add(Row(v.findViewById(R.id.rowBar), v.findViewById(R.id.rowState)))
                      songList.addView(v)
                  }

                  for ((i, item) in items.withIndex()) {
                      if (i >= rows.size) break
                      val r = rows[i]
                      when (item.state) {
                          SongItem.DOWNLOADING -> {
                              r.state.text = item.percent.toString() + "%"
                              r.state.setTextColor(getColor(R.color.cyan))
                              r.bar.progress = item.percent
                          }
                          SongItem.CONVERTING -> {
                              r.state.text = "CONVERSIE"
                              r.state.setTextColor(getColor(R.color.violet))
                              r.bar.progress = 100
                          }
                          SongItem.DONE -> {
                              r.state.text = "GATA"
                              r.state.setTextColor(getColor(R.color.cyan))
                              r.bar.progress = 100
                          }
                          SongItem.SKIPPED -> {
                              r.state.text = "EXISTĂ"
                              r.state.setTextColor(getColor(R.color.violet))
                              r.bar.progress = 0
                          }
                          SongItem.ERROR -> {
                              r.state.text = "EROARE"
                              r.state.setTextColor(getColor(R.color.error))
                              r.bar.progress = 0
                          }
                          else -> {
                              r.state.text = "AȘTEAPTĂ"
                              r.state.setTextColor(getColor(R.color.text2))
                              r.bar.progress = 0
                          }
                      }
                  }

                  val cur = JobState.current
                  if (cur in items.indices) {
                      val s = items[cur]
                      songTitle.text = s.title
                      songCounter.text = "MELODIA " + (cur + 1) + " / " + items.size
                      if (bigShownId != s.id) {
                          bigShownId = s.id
                          loadThumb("https://i.ytimg.com/vi/" + s.id + "/mqdefault.jpg", thumb)
                      }
                  } else if (running) {
                      songTitle.text = "Se citește lista..."
                      songCounter.text = ""
                  }
                  val pct = JobState.overallPercent()
                  progress.progress = pct
                  overallText.text = pct.toString() + "%"
              }
          }
